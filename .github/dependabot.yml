# Action SHAs and Go modules. Dependabot opens update PRs; it does not change pins by itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
