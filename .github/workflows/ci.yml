name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Hermetic only: no secrets, no live-provider flags. Live tests (SDF_LIVE_*)
# skip themselves when their flags/keys are absent.
env:
  UV_LOCKED: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test-sqlite:
    name: pytest (SQLite, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (requires-python >=3.11) and the local dev version.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run hermetic suite
        run: uv run pytest -rs
      # Same suite with a developer-shaped environment: a repo .env and junk
      # SDF_* values. SDF_POSTGRES_TEST_URL is the Postgres gate's opt-in and
      # is left unset here so those tests stay skipped; the postgres job sets
      # it for real. SDF_LIVE_* is not set to 1, so live tests stay skipped.
      - name: Hermetic suite ignores ambient SDF_* and .env
        if: matrix.python-version == '3.13'
        run: |
          cat > .env <<'EOF'
          SDF_DATABASE_URL=postgresql+psycopg://dotenv:dotenv@127.0.0.1:1/nope
          SDF_AUTH_DEV_INSECURE=1
          SDF_AUTH_SINGLE_USER=1
          SDF_AGENT_SANDBOX=e2b
          SDF_EVALUATOR_CONTAINMENT=require
          EOF
          uv run pytest -rs
        env:
          SDF_DATABASE_URL: postgresql+psycopg://junk:junk@127.0.0.1:1/nope
          SDF_WORKSPACE_ROOT: /tmp/sdf-junk-workspaces
          SDF_ARTIFACT_ROOT: /tmp/sdf-junk-artifacts
          SDF_FIXTURES_ROOT: /tmp/sdf-junk-fixtures
          SDF_AUTH_PEPPER: junk-pepper-from-the-ambient-environment
          SDF_AUTH_DEV_INSECURE: "1"
          SDF_AUTH_SINGLE_USER: "1"
          SDF_EVALUATOR_CONTAINMENT: require
          SDF_CONTAINMENT_BACKEND: e2b
          SDF_CONTAINMENT_SMOKE: passed
          SDF_AGENT_SANDBOX: e2b
          SDF_REQUIRE_PLAN_APPROVAL: "1"
          SDF_REQUIRE_CONTAINMENT: "0"
          SDF_TOOL_ALLOWLIST: rm
          SDF_TEST_HERMETIC: "0"
          SDF_LIVE_E2B: "0"

  test-postgres:
    name: pytest (PostgreSQL 16, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sdf_core
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sdf_core"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Same throwaway credentials as docker-compose.test.yml; not a secret.
      PG_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:55432/sdf_core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Apply migrations
        run: uv run alembic upgrade head
        env:
          SDF_DATABASE_URL: ${{ env.PG_URL }}
      # Only SDF_POSTGRES_TEST_URL here: sdf_core.api defaults its engine to
      # SDF_DATABASE_URL, so exporting it would point every API test at this
      # one shared database (as scripts/postgres-test.sh only does per command).
      - name: Run suite with PostgreSQL integration enabled
        run: uv run pytest -rs
        env:
          SDF_POSTGRES_TEST_URL: ${{ env.PG_URL }}
