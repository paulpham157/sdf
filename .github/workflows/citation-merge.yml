# Merges the pull request opened by citation.yml after the required check
# "gitleaks (full history)" has passed. citation.yml also requests merge
# auto-merge with a merge commit; this workflow is what merges the pull
# request when the repository does not allow auto-merge. It does not merge
# any other pull request, and it does not merge while that check is missing
# or failing.
name: Citation merge

on:
  workflow_run:
    workflows: ["PR CI"]
    types: [completed]

# No permissions by default. The job below is the only one that writes.
permissions: {}

concurrency:
  group: citation-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    name: merge citation pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "${{ github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'citation/v') }}"
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run checks out the default branch. The token is not
          # left in .git/config. The merge goes through the pulls API.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Merge citation pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CITATION_COMMAND: merge
          CITATION_BRANCH: ${{ github.event.repository.default_branch }}
          CITATION_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CITATION_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: go run ./internal/citeupdate
