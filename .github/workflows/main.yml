# Post-merge CI. Runs after a push to main. It does not repeat the pull
# request matrix. Nothing here deploys or publishes a release.
name: Main CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A squash merge of a branch that was behind main can combine changes that
  # each passed PR CI and still fail together. One stable run covers that.
  # oldstable stays on the pull request. This is not the two-version matrix.
  recheck:
    name: go test (stable, post-merge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Test
        run: make test

  race:
    name: go test (race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      # The race detector needs cgo. Do not export CGO_ENABLED=0 here.
      - name: Test with the race detector
        run: make race

  integration:
    name: integration (serve and summary)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      # make e2e is CGO_ENABLED=0 go build -trimpath -ldflags="-s -w", then
      # the tests/e2e binary check, sample ingest over HTTP and gRPC, and
      # `sdf summary`.
      - name: Build, receive samples, summarize
        run: make e2e

  snapshot:
    name: goreleaser (snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Snapshot build
        # release.disable in .goreleaser.yaml blocks publishing. --snapshot
        # does not create a GitHub release. Archives land in dist/.
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean
      - name: Upload snapshot archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdf-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/metadata.json
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL (go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:go"

  # Full history of the pushed main commit. Not the ruleset check: that
  # context is "gitleaks (full history)" and it is reported by PR CI.
  # Other branches are the Monday job's responsibility.
  gitleaks:
    name: gitleaks (main history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Scan main history
        env:
          GITLEAKS_EVENT: push
          GITLEAKS_PUSH_SHA: ${{ github.sha }}
        run: bash .github/scripts/gitleaks-scan.sh
