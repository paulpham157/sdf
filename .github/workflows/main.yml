# Post-merge CI. Runs after a push to main. It does not repeat the pull
# request matrix. Nothing here deploys or publishes a release; that is
# release.yml, which runs only when a v* tag is pushed and creates a draft.
name: Main CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A squash merge of a branch that was behind main can combine changes that
  # each passed PR CI and still fail together. One stable run covers that.
  # oldstable stays on the pull request. This is not the two-version matrix.
  recheck:
    name: go test (stable, post-merge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum
      - name: Test
        run: make test

  race:
    name: go test (race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum
      # The race detector needs cgo. Do not export CGO_ENABLED=0 here.
      - name: Test with the race detector
        run: make race

  integration:
    name: integration (serve and summary)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum
      # make e2e is CGO_ENABLED=0 go build -trimpath -ldflags="-s -w", then
      # the tests/e2e binary check, sample ingest over HTTP and gRPC, and
      # `sdf summary`.
      - name: Build, receive samples, summarize
        run: make e2e

  snapshot:
    name: goreleaser (snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Same go.mod toolchain as release.yml, so snapshot archives
          # match release builds. cache: true is unchanged (#244 is not
          # merged, so cache-dependency-path is not added here).
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Snapshot build
        # --snapshot never creates a GitHub release or uploads anything.
        # Archives land in dist/. Real (draft) releases come only from
        # release.yml, on a pushed v* tag.
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean
      - name: Upload snapshot archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdf-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/metadata.json
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL (go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:go"

  # Full history of the pushed main commit. Not the ruleset check: that
  # context is "gitleaks (full history)" and it is reported by PR CI.
  # Other branches are the Monday job's responsibility.
  gitleaks:
    name: gitleaks (main history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Scan main history
        env:
          GITLEAKS_EVENT: push
          GITLEAKS_PUSH_SHA: ${{ github.sha }}
        run: bash .github/scripts/gitleaks-scan.sh
