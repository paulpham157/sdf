  stability: development
- key: a2a.method.name
  type:
    members:
    - id: send_message
      value: SendMessage
      brief: |
        Request to send a message to an agent and receive a non-streaming response.
      stability: development
    - id: send_streaming_message
      value: SendStreamingMessage
      brief: |
        Request to send a message to an agent and receive a streaming response.
      stability: development
    - id: get_task
      value: GetTask
      brief: |
        Request to get the current state of a task.
      stability: development
    - id: cancel_task
      value: CancelTask
      brief: |
        Request to cancel a task.
      stability: development
    - id: subscribe_to_task
      value: SubscribeToTask
      brief: |
        Request to subscribe to task updates.
      stability: development
    - id: list_tasks
      value: ListTasks
      brief: |
        Request to list tasks.
      stability: development
    - id: create_task_push_notification_config
