    brief: |
      This span describes processing of an A2A request received over an HTTP binding (HTTP+JSON or JSON-RPC over HTTP).
    note: |
      When instrumentation can detect that the A2A request is handled within an
      instrumented HTTP server call, it SHOULD enrich the HTTP server span with
      A2A attributes instead of reporting a nested `a2a.server` span.

      Instrumentation SHOULD update the span name to `{a2a.method.name}` once
      the A2A method is known.

      Instrumentation SHOULD use the additional A2A error context to set the
      span status to `ERROR`, as permitted by the
      [HTTP span status conventions](https://github.com/open-telemetry/semantic-conventions/blob/v1.45.0/docs/http/http-spans.md#status),
      and SHOULD set `error.type` according to the
      [A2A error guidance](/docs/gen-ai/a2a.md#server), even when the HTTP response
      indicates success.

      Instrumentation coordinating A2A and HTTP telemetry SHOULD preserve the
      A2A error classification when HTTP processing succeeds. If HTTP processing
      also fails, its error classification SHOULD take precedence in `error.type`,
      following the HTTP server conventions. In that case, the A2A error code
      is not retained separately on the span.

      This precedence normally applies to HTTP 5xx responses or transport
      exceptions. Without additional context, HTTP server instrumentation leaves
      span status unset for 4xx responses and does not set `error.type` based on
      the status code, so the A2A error classification is preserved.
    stability: development
