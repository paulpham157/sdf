- key: client.address
  type: string
  examples:
  - 83.164.160.102
  brief: Client address - domain name if available without reverse DNS lookup; otherwise, IP address or UNIX domain socket name.
  note: |
    The IP address of the original client behind all proxies, if known (e.g. from [Forwarded#for](https://developer.mozilla.org/docs/Web/HTTP/Headers/Forwarded#for), [X-Forwarded-For](https://developer.mozilla.org/docs/Web/HTTP/Headers/X-Forwarded-For), or a similar header). Otherwise, the immediate client peer address.
  stability: stable
  provenance:
    source: 0
- key: client.address
  type: string
  examples:
  - client.example.com
  - 10.1.2.80
  - /tmp/my.sock
  brief: Client address - domain name if available without reverse DNS lookup; otherwise, IP address or UNIX domain socket name.
  note: |
    When observed from the server side, and when communicating through an intermediary, `client.address` SHOULD represent the client address behind any intermediaries, for example proxies, if it's available.
  stability: stable
  provenance:
    source: 0
- key: client.port
  type: int
  examples:
  - 65123
  brief: Client port number.
  note: |
    When observed from the server side, and when communicating through an intermediary, `client.port` SHOULD represent the client port behind any intermediaries, for example proxies, if it's available.
  stability: stable
  provenance:
    source: 0
- key: client.port
  type: int
  examples:
  - 65123
  brief: The port of whichever client was captured in `client.address`.
  note: |
    When observed from the server side, and when communicating through an intermediary, `client.port` SHOULD represent the client port behind any intermediaries, for example proxies, if it's available.
  stability: stable
  provenance:
    source: 0
- key: error.type
  type:
    members:
    - id: other
      value: _OTHER
      brief: |
        A fallback error value to be used when the instrumentation doesn't define a custom value.
      stability: stable
  examples:
  - UNKNOWN
  - DEADLINE_EXCEEDED
  - UNIMPLEMENTED
  - INTERNAL
  - UNAVAILABLE
  - DATA_LOSS
  brief: |
    Describes a class of error the operation ended with.
  note: |
    If the RPC fails with an error before status code is returned,
    `error.type` SHOULD be set to the exception type (its fully-qualified class name, if applicable)
    or a component-specific, low cardinality error identifier.

    If a status code is returned and it indicates an error,
    `error.type` SHOULD be set to that status code. Check system-specific conventions
    for the details on which values of `rpc.status_code` are considered errors.

    The `error.type` value SHOULD be predictable and SHOULD have low cardinality.
    Instrumentations SHOULD document the list of errors they report.

    If the request has completed successfully, instrumentations SHOULD NOT set
    `error.type`.
  stability: stable
  annotations:
    enum_fallback: other
  provenance:
    source: 0
- key: error.type
  type:
    members:
    - id: other
      value: _OTHER
      brief: |
        A fallback error value to be used when the instrumentation doesn't define a custom value.
      stability: stable
  examples:
  - timeout
  - java.net.UnknownHostException
  - server_certificate_invalid
  - '500'
  brief: |
    Describes a class of error the operation ended with.
  note: |
    If the request fails with an error before response status code was sent or received,
    `error.type` SHOULD be set to exception type (its fully-qualified class name, if applicable)
    or a component-specific low cardinality error identifier.

    If response status code was sent or received and status indicates an error according to [HTTP span status definition](/docs/http/http-spans.md),
    `error.type` SHOULD be set to the status code number (represented as a string), an exception type (if thrown) or a component-specific error identifier.

    The `error.type` value SHOULD be predictable and SHOULD have low cardinality.
    Instrumentations SHOULD document the list of errors they report.

    The cardinality of `error.type` within one instrumentation library SHOULD be low, but
    telemetry consumers that aggregate data from multiple instrumentation libraries and applications
    should be prepared for `error.type` to have high cardinality at query time, when no
    additional filters are applied.

    If the request has completed successfully, instrumentations SHOULD NOT set `error.type`.
  stability: stable
  annotations:
    enum_fallback: other
  provenance:
    source: 0
- key: error.type
  type:
    members:
    - id: other
      value: _OTHER
      brief: |
        A fallback error value to be used when the instrumentation doesn't define a custom value.
      stability: stable
  examples:
  - timeout
  - java.net.UnknownHostException
  - server_certificate_invalid
  - '500'
  brief: |
    Describes a class of error the operation ended with.
  note: |
    The `error.type` SHOULD be predictable, and SHOULD have low cardinality.

    When `error.type` is set to a type (e.g., an exception type), its
    canonical class name identifying the type within the artifact SHOULD be used.

    If the recorded error type is a wrapper that is not meaningful for
    failure classification, instrumentation MAY use the type of the inner
    error instead. For example, in Go, errors created with `fmt.Errorf`
    using `%w` MAY be unwrapped when the wrapper type does not help
    classify the failure.

    Instrumentations SHOULD document the list of errors they report.

    The cardinality of `error.type` within one instrumentation library SHOULD be low.
    Telemetry consumers that aggregate data from multiple instrumentation libraries and applications
    should be prepared for `error.type` to have high cardinality at query time when no
    additional filters are applied.

    If the operation has completed successfully, instrumentations SHOULD NOT set `error.type`.

    If a specific domain defines its own set of error identifiers (such as HTTP or RPC status codes),
    it's RECOMMENDED to:

    - Use a domain-specific attribute
    - Set `error.type` to capture all errors, regardless of whether they are defined within the domain-specific set or not.
  stability: stable
  annotations:
    enum_fallback: other
  provenance:
    source: 0
- key: error.type
  type:
    members:
    - id: other
      value: _OTHER
      brief: |
        A fallback error value to be used when the instrumentation doesn't define a custom value.
      stability: stable
  examples:
  - timeout
  - java.net.UnknownHostException
  - server_certificate_invalid
  - '500'
  brief: |
    Describes a class of error the operation ended with.
  note: |
    The `error.type` SHOULD match the error code returned by the Generative AI provider or the client library,
    the canonical name of exception that occurred, or another low-cardinality error identifier.
    Instrumentations SHOULD document the list of errors they report.
  stability: stable
  annotations:
    enum_fallback: other
  provenance:
    source: 0
- key: error.type
  type:
    members:
    - id: other
      value: _OTHER
      brief: |
        A fallback error value to be used when the instrumentation doesn't define a custom value.
      stability: stable
  examples:
  - timeout
  - java.net.UnknownHostException
  - server_certificate_invalid
  - '500'
  brief: |
    Describes a class of error the operation ended with.
  note: |
    This attribute SHOULD be set to the protocol-provided A2A error reason
    when available. Use `google.rpc.ErrorInfo.reason` with domain
    `a2a-protocol.org`, for example `TASK_NOT_FOUND`, consistently across
    JSON-RPC, HTTP+JSON, and gRPC bindings.

    If no A2A error reason is available, use the string representation of
    the JSON-RPC error code or the binding-specific protocol status code,
    following the applicable binding's error conventions. If no protocol
    error response is available, use the canonical name of the exception
    that occurred. Instrumentation SHOULD NOT infer an A2A error reason
    from an HTTP or gRPC status code alone.

    See the A2A specification for
    [error handling](https://a2a-protocol.org/latest/specification/#332-error-handling)
    and
    [error code mappings](https://a2a-protocol.org/latest/specification/#54-error-code-mappings).
  stability: stable
  annotations:
    enum_fallback: other
  provenance:
    source: 0
- key: error.type
  type:
    members:
    - id: other
      value: _OTHER
      brief: |
        A fallback error value to be used when the instrumentation doesn't define a custom value.
      stability: stable
  examples:
  - timeout
  - java.net.UnknownHostException
  - server_certificate_invalid
  - '500'
  brief: |
    Describes a class of error the operation ended with.
  note: |
    When the response carries a JSON-RPC error code that classifies as an error,
    `error.type` SHOULD be set to the string representation of that code. See
    `rpc.status_code` for which codes classify as errors. When an HTTP
    response ends the operation in error without a JSON-RPC error code,
    `error.type` SHOULD be set to the string representation of the HTTP status
    code. Otherwise (for example on timeouts or other transport errors), it SHOULD be
    set to the canonical name of the exception or error that occurred.

    When JSON-RPC call is successful, but an error is returned within the
    result payload, this attribute SHOULD be set to the low-cardinality
    string representation of the error. When
    [CallToolResult](https://github.com/modelcontextprotocol/modelcontextprotocol/blob/9c8a44e47e16b789a1f9d47c89ea23ed13a37cf9/schema/2025-06-18/schema.ts#L715)
    is returned with `isError` set to `true`, this attribute SHOULD be set to
    `tool_error`.

    `rpc.status_code` carries the same string representation of
    the JSON-RPC error code. Unlike `rpc.status_code`,
    `error.type` is also set when no JSON-RPC error response is available.
  stability: stable
  annotations:
    enum_fallback: other
  provenance:
    source: 0
