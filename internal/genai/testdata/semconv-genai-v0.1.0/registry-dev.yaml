  stability: development
  annotations:
    type:
      json_schema: model/gen-ai/gen-ai-memory-records.json
    value:
      unbounded_size: true
- key: gen_ai.memory.store.id
  type: string
  examples:
  - ms_abc123
  - user-preferences-store
  brief: The unique identifier of the memory store.
  note: |
    Semantic conventions for individual components SHOULD document what `gen_ai.memory.store.id` maps to within the implementation.
  stability: development
- key: gen_ai.operation.name
  type:
