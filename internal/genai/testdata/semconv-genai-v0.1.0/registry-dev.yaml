- key: gen_ai.response.time_to_first_chunk
  type: double
  examples:
  - 0.5
  - 1.2
  brief: |
    Time from the start of a logical inference operation to the first chunk in its streaming response, in seconds.
  note: |
    A chunk is a decoded provider stream event carrying new, non-empty output: text, refusals, reasoning (including opaque payloads), audio, images, or tool-call names or arguments. Instrumentations MUST NOT treat empty start events or events carrying only usage, roles, IDs, signatures, keep-alives, progress/status updates, or end markers as chunks. Chunk boundaries follow provider events, not TCP reads, HTTP frames, or extra SDK callbacks.

    Instrumentations SHOULD measure the time from the start of the logical inference operation, before authentication and the first attempt, to when the first chunk is fully received by the client, before application processing. The measurement SHOULD include authentication, failed attempts, and retry backoff.

    Instrumentations SHOULD set this attribute when the first chunk is received and MUST NOT set it if no chunk is received.
  stability: development
