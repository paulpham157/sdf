      stability: development
    - id: embeddings
      value: embeddings
      brief: Embeddings operation such as [OpenAI Create embeddings API](https://platform.openai.com/docs/api-reference/embeddings/create)
      stability: development
    - id: retrieval
      value: retrieval
      brief: Execution of a retrieval pipeline that returns documents relevant to a query
      note: |
        Examples include LangChain, LlamaIndex, and Haystack retrievers.
