- key: gen_ai.input.messages_ref
  type: string
  examples:
  - s3://example-bucket/gen-ai/674f35f4-e3f6-41f5-b104-864b3964f6d3_inputs.json
  brief: An absolute URI identifying the input messages in external storage.
  note: |
    The presence of this attribute does not indicate whether storing the
    content succeeded or whether the content remains available.

    It is NOT RECOMMENDED to embed credentials, such as signed URL
    query parameters, in the URI. Access to the stored content SHOULD be
    secured by other means, for example by storage-level access control.

    > [!Warning]
    > The URI may expose sensitive storage metadata, such as storage provider,
    > bucket or container names, tenant or object identifiers.
  stability: development
- key: gen_ai.main_agent.description
  type: string
  examples:
  - Helps with math problems
  - Generates fiction stories
  brief: The free-form description of the top-level Generative AI agent in the process.
  note: |
    In Agent-to-Agent (A2A) communication, this maps to the `description` property declared in the Agent Card.
  stability: development
- key: gen_ai.main_agent.id
  type: string
  examples:
  - asst_5j66UpCpwteGg4YSxUnt7lPY
  - arn:aws:bedrock:us-east-1:123:agent/42
  - urn:agent:projects-123:projects:123:locations:us-east1:aiplatform:reasoningEngines:456
  brief: The unique and stable identifier of the top-level Generative AI agent in the process
  note: |
    For main agents, this SHOULD be the provider-assigned stable identifier of the agent resource such as [AWS Bedrock agent ARN](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent_Agent.html) or [GCP Agent Registry identifier](https://docs.cloud.google.com/agent-registry/concepts#agent-identifier).
    Instrumentation MUST NOT generate `gen_ai.main_agent.id` from an in-memory or process-local identifier. If no stable identifier is available, the agent entity is not emitted, and instrumentation continues to report `gen_ai.agent.name` at the span level when relevant.
  stability: development
- key: gen_ai.main_agent.name
  type: string
  examples:
  - Math Tutor
  - Fiction Writer
  brief: The human-readable name of the top-level Generative AI agent in the process.
  note: |
    In Agent-to-Agent (A2A) communication, this maps to the `name` property declared in the Agent Card.
  stability: development
- key: gen_ai.memory.query.text
  type: string
  examples:
  - user dietary preferences
  - past flight bookings
  brief: The search query used to retrieve memories.
  note: |
    Instrumentations SHOULD NOT capture this attribute by default. Capture SHOULD be gated
    by an explicit user opt-in via [content capture configuration](/docs/gen-ai/gen-ai-spans.md#content-capture-configuration).

    > [!Warning]
    > This attribute may contain sensitive information.
  stability: development
- key: gen_ai.memory.record.count
  type: int
  examples:
  - 3
  brief: The number of memory records relevant to the operation.
  note: |
    For `search_memory` operations, this is the number of memory records returned by the operation. For `create_memory` operations, this is the number of memory records the operation attempted to create. For `update_memory` operations, this is the number of memory records the operation attempted to modify. For `upsert_memory` operations, this is the number of memory records the operation attempted to create or update. For `delete_memory` operations, this is the number of memory records the operation attempted to delete.
  stability: development
- key: gen_ai.memory.record.id
  type: string
  examples:
  - mem_5j66UpCpwteGg4YSxUnt7lPY
  brief: The unique identifier of the memory record.
  stability: development
