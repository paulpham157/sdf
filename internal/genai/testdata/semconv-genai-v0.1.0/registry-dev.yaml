- key: rpc.status_code
  type: string
  examples:
  - OK
  - DEADLINE_EXCEEDED
  - '-32602'
  brief: The error code from the JSON-RPC response.
  note: |
    This attribute records the [JSON-RPC error code](https://www.jsonrpc.org/specification#error_object)
    returned in the error response.

    The following error codes indicate that the caller sent a request the
    receiver could not serve and SHOULD NOT be considered errors:

    - `-32700` (`Parse error`)
    - `-32600` (`Invalid Request`)
    - `-32601` (`Method not found`)
    - `-32602` (`Invalid params`) - also returned when the requested tool
      does not exist
    - `-32002` ([`Resource not found`](https://modelcontextprotocol.io/specification/2025-11-25/server/resources#error-handling))

    Any other error code SHOULD be considered an error.
  stability: stable
  provenance:
    source: 0
- key: rpc.status_code
  type: string
  examples:
  - OK
  - DEADLINE_EXCEEDED
  - UNAVAILABLE
  brief: |
    The string representation of the [status code](https://github.com/grpc/grpc/blob/v1.75.0/doc/statuscodes.md) returned by the server.
  note: |
    The following status codes SHOULD be considered errors:

    - `UNKNOWN`
    - `DEADLINE_EXCEEDED`
    - `UNIMPLEMENTED`
    - `INTERNAL`
    - `UNAVAILABLE`
    - `DATA_LOSS`

    Instrumentations MAY use additional context or provide configuration options to customize
    which status codes are considered errors.
  stability: stable
  provenance:
    source: 0
