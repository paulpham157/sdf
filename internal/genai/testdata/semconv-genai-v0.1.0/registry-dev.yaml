- key: gen_ai.output.messages
  type: any
  examples:
  - |
    [
      {
        "role": "assistant",
        "parts": [
          {
            "type": "text",
            "content": "The weather in Paris is currently rainy with a temperature of 57°F."
          }
        ]
      }
    ]
  brief: Messages returned by the model where each message represents a specific model response (choice, candidate).
  note: |
    Each message represents a single output choice/candidate generated by
    the model. Each message corresponds to exactly one generation
    (choice/candidate) and vice versa - one choice cannot be split across
    multiple messages or one message cannot contain parts from multiple choices.

    Instrumentations MAY provide a way for users to filter or truncate
    output messages. `gen_ai.response.finish_reasons` remains aligned with the
    generations returned by the provider, not with a filtered or truncated
    `gen_ai.output.messages` value.

    When an operation ends in an error, this attribute SHOULD only be set
    when the operation produced output, including partial streamed output.
    Instrumentation SHOULD NOT synthesize output content for a failed
    operation.

    > [!Warning]
    > This attribute is likely to contain sensitive information including user/PII data.

    See [Recording content on attributes](/docs/gen-ai/gen-ai-spans.md#recording-content-on-attributes)
    section for more details.
  stability: development
  annotations:
    type:
      json_schema: model/gen-ai/gen-ai-output-messages.json
    value:
      unbounded_size: true
- key: gen_ai.output.messages
  type: any
  examples:
  - |
    [
      {
        "role": "assistant",
        "parts": [
          {
            "type": "text",
            "content": "The weather in Paris is currently rainy with a temperature of 57°F."
          }
        ]
      }
    ]
  brief: Messages returned by the model where each message represents a specific model response (choice, candidate).
  note: |
    This attribute represents the output produced by the completed generation. It SHOULD NOT include intermediate events that occur while the generation is active, such as a tool call that the application handles before the generation completes. Recording intermediate realtime events is outside the scope of this convention and is tracked in [#633](https://github.com/open-telemetry/semantic-conventions-genai/issues/633).
  stability: development
  annotations:
    type:
      json_schema: model/gen-ai/gen-ai-output-messages.json
    value:
      unbounded_size: true
- key: gen_ai.output.messages_ref
  type: string
  examples:
  - s3://example-bucket/gen-ai/674f35f4-e3f6-41f5-b104-864b3964f6d3_outputs.json
  brief: An absolute URI identifying the output messages in external storage.
  note: |
    The presence of this attribute does not indicate whether storing the
    content succeeded or whether the content remains available.

    It is NOT RECOMMENDED to embed credentials, such as signed URL
    query parameters, in the URI. Access to the stored content SHOULD be
    secured by other means, for example by storage-level access control.

    > [!Warning]
    > The URI may expose sensitive storage metadata, such as storage provider,
    > bucket or container names, tenant or object identifiers.
  stability: development
- key: gen_ai.output.type
  type:
    members:
    - id: text
      value: text
      brief: Plain text
      stability: development
    - id: json
      value: json
      brief: JSON object with known or unknown schema
      stability: development
    - id: image
      value: image
      brief: Image
      stability: development
    - id: speech
      value: speech
      brief: Speech
      stability: development
  brief: Represents the content type requested by the client.
  note: |
    This attribute SHOULD be set to the output type requested by the client:

    - `json` for structured outputs with defined or undefined schema
    - `image` for image output
    - `speech` for speech output
    - `text` for plain text output

    The attribute specifies the output modality and not the actual output format.
    For example, if an image is requested, the actual output could be a
    URL pointing to an image file.

    Additional output format details may be recorded in the future in the
    `gen_ai.output.{type}.*` attributes.
  stability: development
