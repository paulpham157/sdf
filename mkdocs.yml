# Documentation site for https://docs.softwaredecisionfabric.tech/
# Build: pip install -r requirements-docs.txt && mkdocs build --strict
site_name: Software Decision Fabric
site_url: https://docs.softwaredecisionfabric.tech/
site_description: >-
  A local OpenTelemetry collector and decision ledger for coding agents.
site_author: paulpham157

repo_name: paulpham157/sdf
repo_url: https://github.com/paulpham157/sdf
# Blob path for content.action.view. The stock Material 9.8.2 partial
# rewrites "blob" to "raw"; docs/overrides/partials/actions.html keeps
# this URL so the icon opens the file on GitHub.
edit_uri: blob/main/docs/

copyright: >
  Apache License 2.0 ·
  <a href="https://softwaredecisionfabric.tech/">softwaredecisionfabric.tech</a>

strict: true

docs_dir: docs
site_dir: site
use_directory_urls: true

# Theme partials live in docs/overrides/ (theme.custom_dir). Exclude that
# tree so MkDocs does not copy the templates into the built site.
exclude_docs: |
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  logo: images/logo.svg
  favicon: images/logo.svg
  # Webfonts are self-hosted in docs/stylesheets/extra.css. font: false
  # keeps Material from requesting fonts.googleapis.com.
  font: false
  # System, then light, then dark. primary and accent stay custom on
  # every entry so the body does not fall back to indigo. Material stores
  # the choice and applies it in partials/javascripts/palette.html before
  # the rest of the page paints. Slate opts into the dark semantic tokens.
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    # Same mark as extra.social. The content action is view-only.
    view: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.action.view
    - content.code.copy
    - toc.follow

hooks:
  - mkdocs_hooks.py

plugins:
  - search

extra_css:
  # Copied from design/tokens.css by mkdocs_hooks.py. Not committed.
  - stylesheets/tokens.css
  - stylesheets/extra.css

extra:
  # URL for the header "Website" control. The logo keeps linking to the docs home.
  website: https://softwaredecisionfabric.tech/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/paulpham157/sdf
      name: sdf on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Collect:
    - Receiver: receiver.md
    - Agents: agents.md
    - Summary: summary.md
    - Check the summary: check.md
  - Decide:
    - Outcomes: outcomes.md
    - Decision and link recall: recall.md
    - File permissions: security.md
  - Verify:
    - Tasks: tasks.md
    - Verify: verify.md
    - GitHub Action: action.md
    - Ledger: ledger.md
  - Reference:
    - Agent skills: skills/README.md
    - sdf-decisions skill: skills/sdf-decisions/SKILL.md
    - sdf-decisions scripts: skills/sdf-decisions/scripts/index.md
