# Documentation site for https://docs.softwaredecisionfabric.tech/
# Build: pip install -r requirements-docs.txt && mkdocs build --strict
site_name: Software Decision Fabric
site_url: https://docs.softwaredecisionfabric.tech/
site_description: >-
  A local OpenTelemetry collector and decision ledger for coding agents.
site_author: paulpham157

repo_name: paulpham157/sdf
repo_url: https://github.com/paulpham157/sdf
edit_uri: edit/main/docs/

copyright: >
  Apache License 2.0 ·
  <a href="https://softwaredecisionfabric.tech/">softwaredecisionfabric.tech</a>

strict: true
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  logo: images/logo.svg
  favicon: images/logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
    - toc.follow

hooks:
  - mkdocs_hooks.py

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/paulpham157/sdf
      name: sdf on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Collect:
    - Receiver: receiver.md
    - Agents: agents.md
    - Summary: summary.md
    - Check the summary: check.md
  - Decide:
    - Outcomes: outcomes.md
    - File permissions: security.md
  - Verify:
    - Tasks: tasks.md
    - Verify: verify.md
    - GitHub Action: action.md
    - Ledger: ledger.md
  - Reference:
    - Gaps: gaps.md
    - Session boundaries: research/session-boundary.md
    - Agent skills: skills/README.md
    - sdf-decisions skill: skills/sdf-decisions/SKILL.md
    - sdf-decisions scripts: skills/sdf-decisions/scripts/index.md
