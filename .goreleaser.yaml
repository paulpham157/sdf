# Local and CI builds only. `release.disable` keeps `goreleaser release`
# from publishing. `goreleaser build --snapshot --clean` produces the archives.
version: 2

project_name: sdf

builds:
  - id: sdf
    main: ./cmd/sdf
    binary: sdf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# The only tag in this repo is legacy-v1, which is not semver, so incpatch
# cannot name a snapshot. This template does not read the tag.
snapshot:
  version_template: "0.0.0-{{ .ShortCommit }}"

changelog:
  disable: true

release:
  disable: true
