[project]
name = "sdf-core"
version = "0.1.0"
description = "Software Decision Fabric Core vertical slice"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "e2b>=2,<3",
  "daytona>=0.100,<1",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.45.0,<1.46",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0,<1.46",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    "opentelemetry-sdk>=1.45.0,<1.46",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.27,<1",
    "opentelemetry-sdk>=1.45.0,<1.46",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0,<1.46",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
