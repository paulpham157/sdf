[project]
name = "sdf"
version = "0.0.0"
description = "Collect OpenTelemetry from coding agents and summarize a session."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-proto>=1.27,<2",
]

[project.scripts]
sdf = "sdf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
